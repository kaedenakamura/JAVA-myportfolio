services:
  app:
    build: .
    ports:
      - "9146:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - JDBC_URL=jdbc:mysql://db:3306/test_db
      - JDBC_USER=root
      - JDBC_PASSWORD=ROOT
      # webapps/ROOT 配下にマウントすると WAR 展開前に空の ROOT ができ 404 になるため webapps の外に置く
      - UPLOAD_DIR=/data/uploads
    volumes:
      - ./uploads_data:/data/uploads
    networks:
      - app-network

  db:
    image: mysql:8.0
    ports:
      - "3307:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d
    environment:
      - MYSQL_DATABASE=test_db
      - MYSQL_ROOT_PASSWORD=ROOT
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10
    networks:
      - app-network

networks:
  app-network:
    driver: bridge