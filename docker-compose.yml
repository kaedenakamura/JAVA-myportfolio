services:
  app:
    build: .
    ports:
      - "9146:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - JDBC_URL=jdbc:mysql://db:3306/test_db?useSSL=false&allowPublicKeyRetrieval=true
      - DB_USER=root
      - DB_PASS=ROOT

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=test_db
      - MYSQL_ROOT_PASSWORD=ROOT
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10